<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sexagesimal Clock</title>
<style>
  :root {
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    --bg: #17120d;
    --clay-hi: #d9b98c;
    --clay: #c49a68;
    --clay-lo: #9c7346;
    --ink: #4a3220;
    --ink-hi: rgba(255, 236, 205, .55);
    --text: #e9d7bb;
    --muted: #a88d6c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 38%, #3a2a1b 0%, var(--bg) 70%),
      var(--bg);
    color: var(--text);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(18px, 4vh, 40px);
    padding: 24px 16px;
    overflow: hidden;
  }
  h1 {
    margin: 0; font-weight: normal; letter-spacing: .32em; text-transform: uppercase;
    font-size: clamp(11px, 1.4vw, 14px); color: var(--muted);
  }
  .clock {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(6px, 1.6vw, 22px);
    width: min(1200px, 100%);
  }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 1 1 0; max-width: 340px; }
  .tablet {
    position: relative; width: 100%; aspect-ratio: 100 / 64;
    border-radius: 14% / 20%;
    background:
      radial-gradient(ellipse 90% 70% at 35% 25%, var(--clay-hi) 0%, var(--clay) 55%, var(--clay-lo) 100%);
    box-shadow:
      inset 0 2px 3px rgba(255,240,215,.45),
      inset 0 -6px 14px rgba(70,40,15,.45),
      0 18px 40px rgba(0,0,0,.55),
      0 3px 6px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .tablet::before {               /* clay grain */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: var(--grain);
    mix-blend-mode: multiply; opacity: .55;
  }
  .tablet svg { position: absolute; inset: 6% 7%; width: 86%; height: 88%; overflow: visible; }
  .ink  { fill: var(--ink); }
  .lip  { fill: var(--ink-hi); }
  .label {
    font-size: clamp(10px, 1.1vw, 13px); letter-spacing: .28em; text-transform: uppercase; color: var(--muted);
    display: flex; gap: .9em; align-items: baseline;
  }
  .label .num {
    font-variant-numeric: tabular-nums; letter-spacing: .05em; color: var(--text);
    font-size: 1.35em; min-width: 2ch; text-align: right;
  }
  body.no-numerals .label .num { display: none; }
  .sep { display: flex; flex-direction: column; gap: clamp(10px, 2.2vw, 26px); padding-bottom: 30px; }
  .sep i {
    display: block; width: clamp(7px, 1vw, 12px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 60% 65%, #6b4a2d, #2c1d12);
    box-shadow: 0 1px 0 rgba(255,230,190,.25);
  }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: center; align-items: center;
    font-size: 12px; color: var(--muted); letter-spacing: .08em;
  }
  .seg { display: inline-flex; border: 1px solid #4b3a29; border-radius: 999px; overflow: hidden; }
  .seg button, .btn {
    font: inherit; color: var(--muted); background: transparent; border: 0; padding: 6px 12px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #4b3a29; color: var(--text); }
  .btn { border: 1px solid #4b3a29; border-radius: 999px; }
  .btn:hover, .seg button:hover { color: var(--text); }
  .unit { position: relative; }
  .notation {
    font-variant-numeric: tabular-nums; letter-spacing: .12em; color: var(--text);
    font-size: clamp(14px, 1.8vw, 20px); min-height: 1.4em; margin-top: -8px;
  }
  body:not(.mode-fraction) .notation, body.no-numerals .notation { visibility: hidden; }
  .notation small { color: var(--muted); font-size: .7em; letter-spacing: .2em; text-transform: uppercase; margin-left: .8em; }

  /* One long tablet: the three numerals written in a single line, separated by gaps */
  body.layout-one .clock {
    position: relative; gap: clamp(10px, 3vw, 44px);
    padding: clamp(14px, 2.4vw, 30px) clamp(22px, 4vw, 56px);
    margin-bottom: 34px;
    border-radius: 6% / 26%;
    background: radial-gradient(ellipse 90% 80% at 35% 25%, var(--clay-hi) 0%, var(--clay) 55%, var(--clay-lo) 100%);
    box-shadow: inset 0 2px 3px rgba(255,240,215,.45), inset 0 -8px 18px rgba(70,40,15,.45),
                0 18px 40px rgba(0,0,0,.55), 0 3px 6px rgba(0,0,0,.4);
  }
  body.layout-one .clock::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background-image: var(--grain); mix-blend-mode: multiply; opacity: .55;
  }
  body.layout-one .tablet { background: none; box-shadow: none; border-radius: 0; aspect-ratio: 100 / 60; }
  body.layout-one .tablet::before, body.layout-one .sep { display: none; }
  body.layout-one .label { position: absolute; top: calc(100% + clamp(22px, 3.4vw, 42px)); white-space: nowrap; }
  body.layout-one .unit { max-width: 300px; }

  .note { max-width: 640px; text-align: center; font-size: 12.5px; line-height: 1.6; color: #8a7358; margin: 0; }
  @media (max-width: 560px) { .sep { padding-bottom: 26px; } .note { display: none; } }
  @media (prefers-reduced-motion: reduce) { body { --motion: 0; } }
</style>
</head>
<body>
  <h1>Sexagesimal Clock</h1>

  <div class="clock" id="clock">
    <div class="unit"><div class="tablet"><svg viewBox="0 0 100 56" id="g-h"></svg></div>
      <div class="label"><span class="name" id="l-h">Hours</span><span class="num" id="n-h"></span></div></div>
    <div class="sep"><i></i><i></i></div>
    <div class="unit"><div class="tablet"><svg viewBox="0 0 100 56" id="g-m"></svg></div>
      <div class="label"><span class="name" id="l-m">Minutes</span><span class="num" id="n-m"></span></div></div>
    <div class="sep"><i></i><i></i></div>
    <div class="unit"><div class="tablet"><svg viewBox="0 0 100 56" id="g-s"></svg></div>
      <div class="label"><span class="name" id="l-s">Seconds</span><span class="num" id="n-s"></span></div></div>
  </div>

  <div class="notation" id="notation"></div>

  <div class="controls">
    <span>Time&nbsp;
      <span class="seg" data-opt="time">
        <button data-v="western">Western</button><button data-v="fraction">Day fraction</button>
      </span></span>
    <span>Layout&nbsp;
      <span class="seg" data-opt="layout">
        <button data-v="three">Three tablets</button><button data-v="one">One tablet</button>
      </span></span>
    <span>Zero&nbsp;
      <span class="seg" data-opt="zero">
        <button data-v="empty">Empty</button><button data-v="mark">Placeholder</button>
      </span></span>
    <span>Numerals&nbsp;
      <span class="seg" data-opt="numerals">
        <button data-v="on">On</button><button data-v="off">Off</button>
      </span></span>
    <button class="btn" id="fs">Full screen</button>
  </div>

  <p class="note" id="note"></p>

// Late Babylonian placeholder: two slanted wedges (drawn, not cropped)
const WEDGE = "M0 0 L11 0 L6.6 5.6 L6.4 20 L4.6 20 L4.4 5.6 Z";
GLYPHS[0] = { w: 34, h: 46, p: [
  `<g transform="translate(9 2) scale(1.35) rotate(-38 5.5 10)"><path d="${WEDGE}"/></g>`,
  `<g transform="translate(9 21) scale(1.35) rotate(-38 5.5 10)"><path d="${WEDGE}"/></g>`
], raw: true };

const NS = "http://www.w3.org/2000/svg";
const opts = { zero: "empty", numerals: "on", time: "western", layout: "three" };
try { Object.assign(opts, JSON.parse(localStorage.getItem("sexa-clock") || "{}")); } catch (e) {}
if (!["western", "fraction"].includes(opts.time)) opts.time = "western";
if (!["three", "one"].includes(opts.layout)) opts.layout = "three";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function buildGlyph(n) {
  const g = document.createElementNS(NS, "g");
  if (n === 0 && opts.zero === "empty") return g;
  const gl = GLYPHS[n];
  const scale = 1.02;
  const w = gl.w * scale, h = gl.h * scale;
  g.setAttribute("transform", `translate(${(100 - w) / 2} ${(56 - h) / 2}) scale(${scale})`);
  gl.p.forEach(p => {
    const part = document.createElementNS(NS, "g");
    part.classList.add("part");
    const inner = gl.raw ? p : `<path fill-rule="evenodd" d="${p}"/>`;
    // light lip below-right + dark impression = looks pressed into clay
    part.innerHTML = `<g class="lip" transform="translate(.55 .7)">${inner}</g><g class="ink">${inner}</g>`;
    g.appendChild(part);
  });
  return g;
}

const slots = ["h", "m", "s"].map(k => ({ svg: document.getElementById("g-" + k), num: document.getElementById("n-" + k), val: null }));

function setSlot(slot, n, animate, speed = 1) {
  if (slot.val === n && !animate.force) return;
  slot.val = n;
  slot.num.textContent = String(n).padStart(2, "0");
  const old = [...slot.svg.children];
  const fresh = buildGlyph(n);
  slot.svg.appendChild(fresh);
  if (!animate.on || reduced) { old.forEach(o => o.remove()); return; }

  // old glyph: clay smoothed over
  old.forEach(o => {
    o.style.transformBox = "fill-box"; o.style.transformOrigin = "center";
    o.animate([{ opacity: 1, filter: "blur(0)" }, { opacity: 0, filter: "blur(1.5px)" }],
      { duration: 260 * speed, easing: "ease-in", fill: "forwards" }).onfinish = () => o.remove();
  });
  // new glyph: each wedge group pressed in, tens first, then units
  [...fresh.querySelectorAll(".part")].forEach((p, i) => {
    p.style.transformBox = "fill-box"; p.style.transformOrigin = "50% 60%";
    p.animate([
      { opacity: 0, transform: "translateY(-3px) scale(1.18)" },
      { opacity: 1, transform: "translateY(0) scale(.94)", offset: .65 },
      { opacity: 1, transform: "scale(1)" }
    ], { duration: 360 * speed, delay: (140 + i * 130) * speed, easing: "cubic-bezier(.3,.7,.3,1)", fill: "backwards" });
  });
}

const MODES = {
  western: {
    names: ["Hours", "Minutes", "Seconds"],
    step: 1000,
    note: "Each tablet is one base-60 digit: a corner wedge counts ten, an upright wedge counts one. " +
          "The Babylonians had no zero digit; they left a gap, and later scribes used a pair of slanted wedges as a placeholder."
  },
  fraction: {
    names: ["× 24 min", "× 24 s", "× 0.4 s"],
    step: 400,                       // 1/216000 of a day = exactly 400 ms
    note: "The day written as one sexagesimal fraction, as the astronomers did: the first place counts sixtieths of a day (24 minutes), " +
          "the second sixtieths of that (24 seconds), the third sixtieths again (0.4 seconds). Counted from midnight; Babylonian days began at sunset."
  }
};

function msSinceMidnight(d) {
  return ((d.getHours() * 60 + d.getMinutes()) * 60 + d.getSeconds()) * 1000 + d.getMilliseconds();
}

function digits(d) {
  if (opts.time === "fraction") {
    const t = Math.floor(msSinceMidnight(d) / 400);          // 216000 ticks per day
    return [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60];
  }
  return [d.getHours(), d.getMinutes(), d.getSeconds()];
}

const notation = document.getElementById("notation");
function render(animate) {
  const v = digits(new Date());
  // the fast third place changes every 400 ms, so its animation runs quicker
  v.forEach((n, i) => setSlot(slots[i], n, animate, opts.time === "fraction" && i === 2 ? 0.55 : 1));
  if (opts.time === "fraction") {
    notation.innerHTML = "0;" + v.map(n => String(n).padStart(2, "0")).join(",") + "<small>of a day</small>";
  }
}

let timer;
function tick() {
  render({ on: !document.hidden });
  const step = MODES[opts.time].step;
  timer = setTimeout(tick, step - (msSinceMidnight(new Date()) % step) + 5);   // stay locked to the unit boundary
}

function applyOpts() {
  document.querySelectorAll(".seg").forEach(seg => {
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === opts[seg.dataset.opt]));
  });
  document.body.classList.toggle("no-numerals", opts.numerals === "off");
  document.body.classList.toggle("mode-fraction", opts.time === "fraction");
  document.body.classList.toggle("layout-one", opts.layout === "one");
  const m = MODES[opts.time] || MODES.western;
  ["h", "m", "s"].forEach((k, i) => document.getElementById("l-" + k).textContent = m.names[i]);
  document.getElementById("note").textContent = m.note;
  try { localStorage.setItem("sexa-clock", JSON.stringify(opts)); } catch (e) {}
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  opts[b.parentElement.dataset.opt] = b.dataset.v;
  applyOpts();
  render({ on: false, force: true });
  clearTimeout(timer); timer = setTimeout(tick, 50);      // re-sync to the new mode's step
}));
document.getElementById("fs").addEventListener("click", () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  } catch (e) {}
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) render({ on: false }); });

applyOpts();
render({ on: false });
tick();
</script>
</body>
</html>
